name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布的标签（如 v1.1.2）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: 还原签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::未设置 KEYSTORE_BASE64，将使用 debug 签名（无法覆盖安装正式版）"
          fi

      - name: 构建 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "::notice::keystore $(wc -c < "$KEYSTORE_FILE") bytes sha=$(sha256sum "$KEYSTORE_FILE" | cut -c1-12) aliasLen=${#KEY_ALIAS} pwLen=${#KEYSTORE_PASSWORD} keyPwLen=${#KEY_PASSWORD}"
            keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > ks.log 2>&1 \
              || { echo "::error::签名校验失败：$(grep -v '^$' ks.log | head -c 300 | tr '\n' ' ')"; exit 1; }
          fi
          if ! ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1; then
            grep -E "^e: |error:|FAILURE|What went wrong|Caused by|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            tail -60 build.log
            exit 1
          fi
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ClashPanel-Kotlin-$VERSION.apk"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Clash 面板 Kotlin ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*.apk
